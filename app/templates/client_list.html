{% extends "base.html" %}

{% block title %}Clientes{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes</h1>
    <a href="{% url 'client-create' %}" class="btn btn-primary">Nuevo cliente</a>
</div>

<div class="card">
    <div class="table-responsive">
    <table class="table table-vcenter card-table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th class="w-1"></th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
                <tr>
                    <td><a href="{% url 'client-detail' client.pk %}">{{ client.name }}</a></td>
                    <td>{{ client.email }}</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <a href="{% url 'client-update' client.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="confirmDelete('{% url 'client-delete' client.pk %}', '¿Eliminar a {{ client.name|escapejs }}?')">Eliminar</button>
                        </div>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
