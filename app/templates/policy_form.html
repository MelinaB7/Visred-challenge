<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if renewing %}Renovar Póliza{% else %}Póliza{% endif %}</title>
</head>
<body>
    {% if renewing %}
        <h1>Renovar póliza {{ renewing.number }}</h1>
        <p>Revisá los datos calculados y confirmá, o modificá lo que necesites (por ejemplo, la prima).</p>
    {% else %}
        <h1>Nueva Póliza</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
