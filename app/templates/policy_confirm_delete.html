<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Póliza</title>
</head>
<body>
    <h1>¿Eliminar la póliza {{ policy.number }}?</h1>

    <p>Cliente: {{ policy.client.name }}</p>
    <p>Tipo: {{ policy.policy_type.name }}</p>
    <p>Estado: {{ policy.get_status_display }}</p>
    <p>Fecha de vencimiento: {{ policy.end_date }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
    </form>
</body>
</html>
