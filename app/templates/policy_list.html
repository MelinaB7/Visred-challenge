{% extends "base.html" %}

{% block title %}Pólizas{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <h1>Pólizas</h1>
    <a href="{% url 'policy-create' %}" class="btn btn-primary">Nueva póliza</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div class="d-flex gap-2">
                <input type="text" id="policy-search-input" class="form-control" style="min-width: 280px;" placeholder="Buscar por número o cliente" value="{{ request.GET.search|default:'' }}">
                <button type="button" id="clear-filters-btn" class="btn btn-outline-secondary flex-shrink-0" style="display: none;">Limpiar filtros</button>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-secondary status-filter-btn active" data-status="">Todas</button>
                <button type="button" class="btn btn-outline-secondary status-filter-btn" data-status="active">Vigente</button>
                <button type="button" class="btn btn-outline-secondary status-filter-btn" data-status="expired">Vencida</button>
                <button type="button" class="btn btn-outline-secondary status-filter-btn" data-status="renewed">Renovada</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="table-responsive">
    <table class="table table-vcenter card-table">
        <thead>
            <tr>
                <th>Número</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th class="w-1"></th>
            </tr>
        </thead>
        <tbody id="policy-table-body">
            {% for policy in policies %}
                <tr>
                    <td>{{ policy.number }}</td>
                    <td>{{ policy.client.name }}</td>
                    <td>{{ policy.get_status_display }}</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <a href="{% url 'policy-detail' policy.pk %}" class="btn btn-sm btn-outline-primary">Detalle</a>
                            <a href="{% url 'policy-update' policy.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="confirmDelete('{% url 'policy-delete' policy.pk %}', '¿Eliminar la póliza {{ policy.number|escapejs }}?')">Eliminar</button>
                        </div>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
        </table>
    </div>
</div>

<script>
(function () {
    const searchInput = document.getElementById('policy-search-input');
    const clearButton = document.getElementById('clear-filters-btn');
    const statusButtons = document.querySelectorAll('.status-filter-btn');
    const tableBody = document.getElementById('policy-table-body');

    let currentStatus = '';
    let debounceTimer = null;

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function updateClearButton() {
        const hasFilter = searchInput.value.trim() !== '' || currentStatus !== '';
        clearButton.style.display = hasFilter ? 'inline-block' : 'none';
    }

    function renderRows(policies) {
        if (policies.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary py-4">No se encontraron pólizas.</td></tr>';
            return;
        }

        tableBody.innerHTML = policies.map(function (policy) {
            return '<tr>' +
                '<td>' + escapeHtml(policy.number) + '</td>' +
                '<td>' + escapeHtml(policy.client_name) + '</td>' +
                '<td>' + escapeHtml(policy.status_display) + '</td>' +
                '<td><div class="d-flex flex-wrap gap-1">' +
                    '<a href="' + policy.detail_url + '" class="btn btn-sm btn-outline-primary">Detalle</a>' +
                    '<a href="' + policy.update_url + '" class="btn btn-sm btn-outline-secondary">Editar</a>' +
                    '<button type="button" class="btn btn-sm btn-outline-danger" onclick="confirmDelete(\'' + policy.delete_url + '\', \'¿Eliminar la póliza ' + escapeHtml(policy.number) + '?\')">Eliminar</button>' +
                '</div></td>' +
            '</tr>';
        }).join('');
    }

    function fetchPolicies() {
        const params = new URLSearchParams();
        if (currentStatus) params.set('status', currentStatus);
        if (searchInput.value.trim()) params.set('search', searchInput.value.trim());

        fetch('{% url "policy-list-json" %}?' + params.toString())
            .then(function (response) { return response.json(); })
            .then(function (data) { renderRows(data.policies); })
            .catch(function () {
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Ocurrió un error al buscar.</td></tr>';
            });

        updateClearButton();
    }

    searchInput.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(fetchPolicies, 300);
    });

    statusButtons.forEach(function (button) {
        button.addEventListener('click', function () {
            statusButtons.forEach(function (btn) { btn.classList.remove('active'); });
            button.classList.add('active');
            currentStatus = button.dataset.status;
            fetchPolicies();
        });
    });

    clearButton.addEventListener('click', function () {
        searchInput.value = '';
        currentStatus = '';
        statusButtons.forEach(function (btn) { btn.classList.remove('active'); });
        statusButtons[0].classList.add('active');
        fetchPolicies();
    });
})();
</script>
{% endblock %}
