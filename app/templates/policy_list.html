{% extends "base.html" %}

{% block title %}Pólizas{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <h1>Pólizas</h1>
    <a href="{% url 'policy-create' %}" class="btn btn-primary">Nueva póliza</a>
</div>

<div class="card">
    <table class="table table-vcenter card-table">
        <thead>
            <tr>
                <th>Número</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th class="w-1"></th>
            </tr>
        </thead>
        <tbody>
            {% for policy in policies %}
                <tr>
                    <td><a href="{% url 'policy-detail' policy.pk %}">{{ policy.number }}</a></td>
                    <td>{{ policy.client.name }}</td>
                    <td>{{ policy.get_status_display }}</td>
                    <td class="text-nowrap">
                        <a href="{% url 'policy-update' policy.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                        <a href="{% url 'policy-delete' policy.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
